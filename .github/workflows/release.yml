name: 发布

# 推一个 v* 的 tag，就跑测试、构建 Windows 安装包，并挂到同名 Release 上。
# 手动触发不在支持范围内：Release 必须对应一个 tag，否则版本号没有出处。
on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    # 创建 Release、上传附件都要写权限
    permissions:
      contents: write

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 target/，否则每次都从头编 400 多个 crate
      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: npm ci

      # 先过测试再发布：这一版已经打上 tag，坏了就不该发出去
      - name: 前端测试
        run: npm test

      - name: 前端类型检查
        run: npm run typecheck

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建安装包
        run: npm run tauri build

      # 不改名就直接上传的话，GitHub 会把附件名里的非 ASCII 字符丢掉：
      # 「青简_0.1.1_x64-setup.exe」会变成「_0.1.1_x64-setup.exe」。
      - name: 改成 ASCII 文件名
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" "out/Qingjian_${version}_x64-setup.exe"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "out/Qingjian_${version}_x64_zh-CN.msi"
          Get-ChildItem out | Select-Object Name, Length

      # 用 gh 而不是 tauri-action：附件名与更新说明都要自己说了算，
      # 说明直接取仓库里的 release-notes.md，与本地发布用的是同一份。
      - name: 发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view '${{ github.ref_name }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' `
              --title "青简 ${{ github.ref_name }}" `
              --notes-file release-notes.md `
              --verify-tag
          }
          gh release upload '${{ github.ref_name }}' out/* --clobber

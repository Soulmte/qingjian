name: 发布

# 推一个 v* 的 tag，就跑测试、构建 Windows 安装包，并挂到同名 Release 上。
# 手动触发不在支持范围内：Release 必须对应一个 tag，否则版本号没有出处。
on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    # 创建 Release、上传附件都要写权限
    permissions:
      contents: write

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 target/，否则每次都从头编 400 多个 crate
      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: npm ci

      # 先过测试再发布：这一版已经打上 tag，坏了就不该发出去
      - name: 前端测试
        run: npm test

      - name: 前端类型检查
        run: npm run typecheck

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 签名私钥由仓库 secret 注入。`createUpdaterArtifacts` 会用它给更新包签名
      # 并产出 .sig；应用端拿 tauri.conf.json 里的公钥验签，签名对不上就拒绝安装。
      # 私钥生成时没设密码，所以密码传空串（secret 不存在时也解析成空串）。
      - name: 构建安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # 不改名就直接上传的话，GitHub 会把附件名里的非 ASCII 字符丢掉：
      # 「青简_0.1.2_x64-setup.exe」会变成「_0.1.2_x64-setup.exe」。
      # latest.json 里的下载地址因此必须指向改名后的 ASCII 文件，否则更新器
      # 会去下一个 404。
      - name: 整理产物并生成 latest.json
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name }}
        run: |
          $version = "$env:GH_TAG".TrimStart('v')
          $nsis = "src-tauri/target/release/bundle/nsis"
          $msi = "src-tauri/target/release/bundle/msi"
          New-Item -ItemType Directory -Force -Path out | Out-Null

          # 安装程序本体（给手动安装的用户）与 MSI，同样只换 ASCII 名
          Copy-Item "$nsis/*-setup.exe" "out/Qingjian_${version}_x64-setup.exe"
          Copy-Item "$msi/*.msi" "out/Qingjian_${version}_x64_zh-CN.msi"

          # 更新器真正要下载的那一份，连同它的签名（.sig 的内容会写进 latest.json）。
          # Tauri 2.x 默认直接给 .exe 本体签名（createUpdaterArtifacts: true）；
          # 若换成 v1Compatible 兼容格式，则会多包一层 .nsis.zip，两种都认。
          $zip = Get-ChildItem "$nsis/*-setup.nsis.zip" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($zip) {
            $payload = "Qingjian_${version}_x64-setup.nsis.zip"
            Copy-Item $zip.FullName "out/$payload"
            Copy-Item "$($zip.FullName).sig" "out/${payload}.sig"
          } else {
            $payload = "Qingjian_${version}_x64-setup.exe"
            Copy-Item "$nsis/*-setup.exe.sig" "out/${payload}.sig"
          }

          # latest.json 是更新器的入口：版本、更新说明、每个平台更新包的地址与签名。
          # 更新器只认 windows-x86_64 这个键名。
          $signature = (Get-Content "out/${payload}.sig" -Raw).Trim()
          $url = "https://github.com/$env:GH_REPO/releases/download/$env:GH_TAG/$payload"
          $manifest = @{
            version = $version
            notes = (Get-Content release-notes.md -Raw)
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path out/latest.json -Encoding utf8

          Get-ChildItem out | Select-Object Name, Length

      # 便携版：解压即用，不打安装包。浏览器的下载保护主要盯 exe，zip 撞不上，所以
      # 这是给「安装包被拦下来」的用户留的逃生门。顺带把三份产物的 SHA-256 一起发
      # 出去，别人能核对，不必只凭感觉点「保留」。
      - name: 打便携版 zip 与校验和
        shell: pwsh
        env:
          GH_TAG: ${{ github.ref_name }}
        run: |
          $version = "$env:GH_TAG".TrimStart('v')

          $stage = "stage-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/qingjian.exe" "$stage/qingjian.exe"
          (Get-Content packaging/portable/README.txt -Raw -Encoding UTF8) -replace '__VERSION__', $version |
            Set-Content "$stage/README.txt" -Encoding utf8BOM

          # 用 Compress-Archive 而不是 tar：PATH 里如果有 Git 自带的 GNU tar，它会把
          # "D:\..." 当成「远程主机:路径」而失败。两个条目名都是 ASCII，没有编码顾虑。
          Compress-Archive -Path "$stage/qingjian.exe", "$stage/README.txt" `
            -DestinationPath "out/Qingjian_${version}_x64-portable.zip" `
            -CompressionLevel Optimal -Force

          $targets = @(
            "out/Qingjian_${version}_x64-setup.exe"
            "out/Qingjian_${version}_x64_zh-CN.msi"
            "out/Qingjian_${version}_x64-portable.zip"
          )
          $lines = foreach ($target in $targets) {
            "$((Get-FileHash $target -Algorithm SHA256).Hash)  $(Split-Path $target -Leaf)"
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding ascii

          Get-ChildItem out | Select-Object Name, Length

      # 用 gh 而不是 tauri-action：附件名与更新说明都要自己说了算，
      # 说明直接取仓库里的 release-notes.md，与本地发布用的是同一份。
      - name: 发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view '${{ github.ref_name }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' `
              --title "青简 ${{ github.ref_name }}" `
              --notes-file release-notes.md `
              --verify-tag
          }
          gh release upload '${{ github.ref_name }}' out/* --clobber
